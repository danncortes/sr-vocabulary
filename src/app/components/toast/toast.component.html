<div class="toast z-50">
    @for (
        notification of toastService.notifications() | keyvalue;
        track notification
    ) {
        <div
            [className]="`alert alert-${notification.value.type} shadow-lg rounded-lg`"
        >
            <span class="text-white pre-wrap">{{
                notification.value.message
            }}</span>
        </div>
    }
</div>
