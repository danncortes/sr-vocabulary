<main class="flex min-h-screen items-center justify-center bg-gray-200 px-4">
    <section class="w-full max-w-sm rounded-lg bg-white p-8 shadow-lg">
        <h1 class="mb-2 text-2xl font-semibold">Sr Vocabulary</h1>
        <p class="mb-8 text-sm text-gray-600">
            Sign in with the authorized Google account.
        </p>

        @if (errorMessage()) {
            <div class="error-message mb-4 text-sm text-red-600" role="alert">
                {{ errorMessage() }}
            </div>
        }

        <button
            type="button"
            class="google-login-button btn btn-block border-gray-300 bg-white text-gray-800 hover:bg-gray-50"
            [disabled]="isLoading()"
            (click)="loginWithGoogle()"
        >
            @if (isLoading()) {
                <span class="loading loading-spinner loading-sm"></span>
                Redirecting…
            } @else {
                <svg aria-hidden="true" viewBox="0 0 24 24" class="h-5 w-5">
                    <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4Z" />
                    <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1a5.8 5.8 0 0 1-5.5-4H3.2v2.6A10 10 0 0 0 12 22Z" />
                    <path fill="#FBBC05" d="M6.5 14.1A6 6 0 0 1 6.2 12c0-.7.1-1.4.3-2.1V7.3H3.2A10 10 0 0 0 2 12c0 1.7.4 3.3 1.2 4.7l3.3-2.6Z" />
                    <path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.8A9.7 9.7 0 0 0 12 2a10 10 0 0 0-8.8 5.3l3.3 2.6a5.8 5.8 0 0 1 5.5-4Z" />
                </svg>
                Continue with Google
            }
        </button>
    </section>
</main>
